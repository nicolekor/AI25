<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>Markdown Viewer</title>
  <!-- marked.js: Markdown → HTML 파싱 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* 기본 스타일: 가독성 향상 */
    body {
      max-width: 800px;
      margin: 2rem auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      line-height: 1.6;
      padding: 0 1rem;
    }
    h1, h2, h3, h4, h5, h6 { margin-top: 2rem; }
    pre { background: #f6f8fa; padding: 1rem; overflow-x: auto; }
    code { background: #f6f8fa; padding: .2rem .4rem; border-radius: 3px; }
    blockquote { border-left: 4px solid #ddd; padding-left: 1rem; color: #666; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: .5rem; }
  </style>
</head>
<body>

  <!-- Markdown이 렌더링될 컨테이너 -->
  <div id="content">Loading...</div>

  <script>
    // 같은 폴더에 있는 Markdown 파일 경로
    const mdFile = 'selfie2anime-pr_fin_2.md';

    fetch(mdFile)
      .then(res => {
        if (!res.ok) throw new Error(`Failed to load ${mdFile}: ${res.status}`);
        return res.text();
      })
      .then(md => {
        // marked()가 Markdown 텍스트를 HTML로 변환
        document.getElementById('content').innerHTML = marked(md);
      })
      .catch(err => {
        document.getElementById('content').textContent = err.message;
      });
  </script>
</body>
</html>
